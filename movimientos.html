<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFácil - Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex">
    <div class="sidebar col-md-2 p-0">
        <h4 class="text-center py-4 border-bottom border-secondary"><i class="fas fa-boxes"></i> StockFácil</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="productos.html"><i class="fas fa-box me-2"></i> Productos</a>
        <a href="movimientos.html" class="active"><i class="fas fa-exchange-alt me-2"></i> Movimientos</a>
        <a href="#" id="btnLogout" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a>
    </div>

    <div class="content col-md-10 bg-light">
        <h2 class="mb-4 pb-2 border-bottom">Registro de Movimientos</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white">Registrar Entrada / Salida</div>
                    <div class="card-body">
                        <form id="formMovimiento" class="needs-validation" novalidate>
                            <div class="mb-2">
                                <label class="form-label">Tipo de Movimiento</label>
                                <select class="form-select" name="tipo" required>
                                    <option value="">Seleccione...</option>
                                    <option value="entrada">Entrada (Compra)</option>
                                    <option value="salida">Salida (Venta/Merma)</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Producto</label>
                                <select class="form-select" name="producto_id" id="selectProductos" required>
                                    <option value="">Seleccione el producto...</option>
                                    <!-- JS llenará esto -->
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Cantidad</label>
                                <input type="number" class="form-control" name="cantidad" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Proveedor (Opcional)</label>
                                <select class="form-select">
                                    <option value="">Ninguno</option>
                                    <option>Distribuidora Escolar S.A.</option>
                                    <option>Papeles del Norte</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrar Movimiento</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">Historial Reciente</div>
                    <div class="card-body">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Producto</th>
                                    <th>Cant.</th>
                                    <th>Usuario</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMovimientos">
                                <!-- JS llenará esto -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="movimientos.js"></script>
</body>
</html>
