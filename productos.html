<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFácil - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex">
    <div class="sidebar col-md-2 p-0">
        <h4 class="text-center py-4 border-bottom border-secondary"><i class="fas fa-boxes"></i> StockFácil</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="productos.html" class="active"><i class="fas fa-box me-2"></i> Productos</a>
        <a href="movimientos.html"><i class="fas fa-exchange-alt me-2"></i> Movimientos</a>
        <a href="#" id="btnLogout" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a>
    </div>

    <div class="content col-md-10 bg-light">
        <h2 class="mb-4 pb-2 border-bottom">Gestión de Productos</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">Registrar Nuevo Producto</div>
                    <div class="card-body">
                        <form id="formProducto" class="needs-validation" novalidate>
                            <div class="mb-2">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control" name="nombre" required>
                                <div class="invalid-feedback">El nombre es obligatorio.</div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" name="categoria" required>
                                    <option value="">Seleccione...</option>
                                    <option>Papelería</option>
                                    <option>Abarrotes</option>
                                    <option>Farmacia</option>
                                </select>
                                <div class="invalid-feedback">Seleccione una categoría.</div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Precio Compra</label>
                                <input type="number" step="0.01" class="form-control" name="precio_compra" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Precio Venta</label>
                                <input type="number" step="0.01" class="form-control" name="precio_venta" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Stock Inicial</label>
                                <input type="number" class="form-control" name="stock" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">Lista de Productos</div>
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>P. Venta</th>
                                    <th>Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos">
                                <!-- JS llenará esto -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Editar Producto -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEditProducto">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Editar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" id="edit-id">
          <div class="mb-2">
            <label>Nombre</label>
            <input type="text" class="form-control" name="nombre" id="edit-nombre" required>
          </div>
          <div class="mb-2">
            <label>Precio Venta</label>
            <input type="number" step="0.01" class="form-control" name="precio_venta" id="edit-precio" required>
          </div>
          <div class="mb-2">
            <label>Stock</label>
            <input type="number" class="form-control" name="stock" id="edit-stock" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="productos.js"></script>
</body>
</html>
